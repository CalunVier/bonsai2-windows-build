
name: Build Bonsai 2 CUDA for RTX 3060 Ti

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout optimized llama.cpp
        uses: actions/checkout@v4
        with:
          repository: sudoingX/llama.cpp
          ref: pr-ptq1-mmv
          path: source
          persist-credentials: false

      - name: Install CUDA 12.4
        uses: ./source/.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"
          cuda_arch: "x64"

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Ninja installation failed"
          }

      - name: Configure and build CUDA
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          where cl
          if errorlevel 1 exit /b 1

          where nvcc
          if errorlevel 1 exit /b 1

          where ninja
          if errorlevel 1 exit /b 1

          cmake -S source -B source/build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=86-real ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe" ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_EXAMPLES=ON ^
            -DLLAMA_BUILD_TESTS=OFF

          if errorlevel 1 exit /b 1

          cmake --build source/build ^
            --config Release ^
            --parallel 2 ^
            --target llama-server llama-bench

          if errorlevel 1 exit /b 1

      - name: Package executables and DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path dist -Force |
            Out-Null

          $server = Get-ChildItem source/build/bin `
            -Recurse -Filter llama-server.exe |
            Select-Object -First 1

          if (-not $server) {
            throw "llama-server.exe not found"
          }

          $bin = $server.DirectoryName

          if (-not (Test-Path (Join-Path $bin "llama-bench.exe"))) {
            throw "llama-bench.exe not found"
          }

          Copy-Item (Join-Path $bin "*") dist `
            -Recurse -Force

          foreach ($dir in @(
            "$env:CUDA_PATH\bin",
            "$env:CUDA_PATH\bin\x64"
          )) {
            if (-not (Test-Path $dir)) {
              continue
            }

            foreach ($pattern in @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
            )) {
              Get-ChildItem $dir -Filter $pattern -File |
                Copy-Item -Destination dist -Force
            }
          }

          Get-ChildItem dist

          if (-not (Test-Path dist/llama-server.exe)) {
            throw "Packaging failed"
          }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-cuda-sm86-windows
          path: dist/
          retention-days: 7
          if-no-files-found: error
